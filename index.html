<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Learn Java in small steps. Short lessons where you type real code.">
  <meta name="theme-color" content="#f4f7ff">
  <title>Java Monkey</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the saved appearance before the first paint to avoid a flash.
    (() => {
      const read = key => { try { return localStorage.getItem(key); } catch { return null; } };
      const theme = read('jm.theme') || 'system';
      const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.accent = read('jm.accent') || 'blue';
    })();
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <i class="blob"></i><i class="blob"></i><i class="blob"></i><i class="blob"></i><i class="blob"></i>
    <i class="glow" id="glow"></i>
    <i class="grain"></i>
  </div>
  <div class="bar" id="bar" aria-hidden="true"></div>
  <div id="app"></div>
  <div id="layer"></div>
  <div class="fx" id="fx" aria-hidden="true"></div>
  <noscript>Java Monkey needs JavaScript to display its lessons.</noscript>

  <script src="js/core.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/grade.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/i18n.js"></script>
  <script src="data/en.js"></script>
  <script src="data/es.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
